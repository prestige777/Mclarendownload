<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mclarendownload</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #111;
      padding: 30px;
      border-radius: 10px;
      border: 2px solid #e60000;
    }
    h1 {
      color: #e60000;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #e60000;
      background: #000;
      color: #fff;
      border-radius: 5px;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      background: #e60000;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #b30000;
    }
    button:disabled {
      background: #666;
      cursor: not-allowed;
    }
    .info {
      background: #1a1a1a;
      padding: 15px;
      margin: 15px 0;
      border-radius: 5px;
      border-left: 4px solid #e60000;
      display: none;
    }
    .info.show {
      display: block;
    }
    .success {
      color: #90EE90;
    }
    .error {
      color: #FF6B6B;
    }
    .loading {
      color: #87CEEB;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 Mclarendownload</h1>
    
    <input type="text" id="url" placeholder="Paste YouTube or Facebook URL here">
    <button onclick="search()">🔍 Search</button>
    
    <div id="info" class="info"></div>
    
    <button id="downloadBtn" onclick="download()" style="display: none;">⬇️ Download Video</button>
    <button id="openBtn" onclick="openTab()" style="display: none;">🔗 Open in New Tab</button>
  </div>

  <script>
    let videoData = null;

    function showInfo(message, type) {
      const info = document.getElementById('info');
      info.innerHTML = message;
      info.className = 'info show ' + type;
    }

    function hideInfo() {
      document.getElementById('info').className = 'info';
    }

    function search() {
      const url = document.getElementById('url').value.trim();
      
      if (!url) {
        showInfo('❌ Please enter a URL', 'error');
        return;
      }

      showInfo('⏳ Fetching video...', 'loading');
      document.getElementById('downloadBtn').style.display = 'none';
      document.getElementById('openBtn').style.display = 'none';

      let endpoint = '';
      if (url.includes('facebook')) {
        endpoint = '/api/download-facebook';
      } else if (url.includes('youtube') || url.includes('youtu.be')) {
        endpoint = '/api/download-youtube';
      } else {
        showInfo('❌ Unsupported URL. Use YouTube or Facebook.', 'error');
        return;
      }

      fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: url })
      })
      .then(r => r.json())
      .then(data => {
        if (data.success) {
          videoData = data;
          showInfo(`✅ Ready! <br> Title: ${data.title} <br> Quality: ${data.quality}`, 'success');
          document.getElementById('downloadBtn').style.display = 'block';
          document.getElementById('openBtn').style.display = 'block';
        } else {
          showInfo('❌ ' + (data.error || 'Could not fetch video'), 'error');
        }
      })
      .catch(e => showInfo('❌ Error: ' + e.message, 'error'));
    }

    function download() {
      if (!videoData) return;
      const a = document.createElement('a');
      a.href = videoData.videoUrl;
      a.download = videoData.title + '.mp4';
      a.click();
      showInfo('✅ Download started!', 'success');
    }

    function openTab() {
      if (!videoData) return;
      window.open(videoData.videoUrl, '_blank');
      showInfo('✅ Opened in new tab', 'success');
    }
  </script>
</body>
</html>
