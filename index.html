<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mclarendownload</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #000 0%, #1a1a1a 100%);
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 3em;
      color: #e60000;
      text-shadow: 0 0 20px rgba(230, 0, 0, 0.5);
      margin-bottom: 10px;
    }

    .subtitle {
      color: #aaa;
      font-size: 1.1em;
    }

    .input-section {
      background: #111;
      padding: 30px;
      border-radius: 12px;
      border: 2px solid #e60000;
      margin-bottom: 30px;
      box-shadow: 0 0 30px rgba(230, 0, 0, 0.2);
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 15px;
      border: 2px solid #333;
      border-radius: 8px;
      background: #000;
      color: #fff;
      font-size: 1em;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #e60000;
    }

    .btn {
      padding: 15px 30px;
      border: none;
      border-radius: 8px;
      background: #e60000;
      color: #fff;
      font-size: 1em;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn:hover {
      background: #b30000;
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(230, 0, 0, 0.4);
    }

    .btn:disabled {
      background: #666;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: #333;
    }

    .btn-secondary:hover {
      background: #555;
    }

    .video-section {
      background: #111;
      padding: 30px;
      border-radius: 12px;
      border: 2px solid #e60000;
      margin-bottom: 30px;
      display: none;
      box-shadow: 0 0 30px rgba(230, 0, 0, 0.2);
    }

    .video-section.active {
      display: block;
    }

    .video-info-box {
      background: #0a0a0a;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      border-left: 4px solid #e60000;
    }

    .video-info-box h3 {
      color: #e60000;
      margin-bottom: 10px;
    }

    .video-info-box p {
      color: #ccc;
      margin: 5px 0;
    }

    .download-controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .status {
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
      font-weight: bold;
    }

    .status.show {
      display: block;
    }

    .status.success {
      background: #1a5f1a;
      color: #90EE90;
      border: 1px solid #90EE90;
    }

    .status.error {
      background: #5f1a1a;
      color: #FF6B6B;
      border: 1px solid #FF6B6B;
    }

    .status.loading {
      background: #1a3a5f;
      color: #87CEEB;
      border: 1px solid #87CEEB;
    }

    footer {
      text-align: center;
      color: #666;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎬 Mclarendownload</h1>
      <p class="subtitle">Download YouTube & Facebook Videos</p>
    </header>

    <div class="input-section">
      <p style="margin-bottom: 15px; color: #ccc;">Paste a YouTube or Facebook video URL:</p>
      <div class="input-group">
        <input 
          type="text" 
          id="videoUrl" 
          placeholder="https://www.youtube.com/watch?v=... or https://www.facebook.com/..."
        >
        <button class="btn" onclick="searchVideo()">Search</button>
      </div>
      <div id="statusSearch" class="status"></div>
    </div>

    <div id="videoSection" class="video-section">
      <div id="statusDownload" class="status"></div>
      
      <div class="video-info-box">
        <h3>Video Details</h3>
        <p id="videoTitle">Title: Loading...</p>
        <p id="videoQuality">Quality: Preparing...</p>
        <p id="videoUrl" style="word-break: break-all; font-size: 0.85em; color: #999;">URL: <span id="urlText"></span></p>
      </div>

      <div class="download-controls">
        <button class="btn" id="downloadBtn" onclick="downloadVideo()">⬇️ Download Video</button>
        <button class="btn btn-secondary" id="openBtn" onclick="openInNewTab()">🔗 Open in New Tab</button>
      </div>
    </div>

    <footer>
      <p>&copy; 2026 Mclarendownload. All rights reserved.</p>
    </footer>
  </div>

  <script>
    let currentUrl = '';
    let currentVideoData = null;

    function getYouTubeId(url) {
      const regex = /(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
      const match = url.match(regex);
      return match ? match[1] : null;
    }

    function showStatus(elementId, message, type) {
      const el = document.getElementById(elementId);
      el.textContent = message;
      el.className = `status show ${type}`;
    }

    function clearStatus(elementId) {
      const el = document.getElementById(elementId);
      el.className = 'status';
    }

    function searchVideo() {
      const url = document.getElementById('videoUrl').value.trim();
      const videoSection = document.getElementById('videoSection');

      if (!url) {
        showStatus('statusSearch', '❌ Please enter a URL', 'error');
        videoSection.classList.remove('active');
        return;
      }

      clearStatus('statusSearch');

      if (url.includes('youtube.com') || url.includes('youtu.be')) {
        const videoId = getYouTubeId(url);
        if (videoId) {
          currentUrl = url;
          showStatus('statusDownload', '⏳ Preparing video...', 'loading');
          fetchVideoData(url, '/api/download-youtube');
        } else {
          showStatus('statusSearch', '❌ Invalid YouTube URL', 'error');
          videoSection.classList.remove('active');
        }
      } else if (url.includes('facebook.com')) {
        currentUrl = url;
        showStatus('statusDownload', '⏳ Preparing video...', 'loading');
        fetchVideoData(url, '/api/download-facebook');
      } else {
        showStatus('statusSearch', '❌ Unsupported URL. Use YouTube or Facebook links.', 'error');
        videoSection.classList.remove('active');
      }
    }

    function fetchVideoData(url, endpoint) {
      const videoSection = document.getElementById('videoSection');
      
      fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: url })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          currentVideoData = data;
          videoSection.classList.add('active');
          
          document.getElementById('videoTitle').textContent = `Title: ${data.title || 'Unknown'}`;
          document.getElementById('videoQuality').textContent = `Quality: ${data.quality || 'Unknown'}`;
          document.getElementById('urlText').textContent = url;
          
          clearStatus('statusDownload');
          showStatus('statusDownload', '✅ Video ready! Click Download or Open in New Tab.', 'success');
        } else {
          showStatus('statusDownload', `❌ ${data.error || 'Could not fetch video data'}`, 'error');
          videoSection.classList.remove('active');
        }
      })
      .catch(err => {
        showStatus('statusDownload', `❌ Error: ${err.message}`, 'error');
        videoSection.classList.remove('active');
      });
    }

    function downloadVideo() {
      if (!currentVideoData) {
        showStatus('statusDownload', '❌ Please search for a video first', 'error');
        return;
      }

      const btn = document.getElementById('downloadBtn');
      btn.disabled = true;
      btn.textContent = '⏳ Downloading...';

      const a = document.createElement('a');
      a.href = currentVideoData.videoUrl;
      a.download = (currentVideoData.title || 'video') + '.mp4';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      
      showStatus('statusDownload', '✅ Download started! Check your Downloads folder.', 'success');
      
      setTimeout(() => {
        btn.disabled = false;
        btn.textContent = '⬇️ Download Video';
      }, 1000);
    }

    function openInNewTab() {
      if (!currentVideoData) {
        showStatus('statusDownload', '❌ Please search for a video first', 'error');
        return;
      }

      window.open(currentVideoData.videoUrl, '_blank');
      showStatus('statusDownload', '✅ Video opened in new tab', 'success');
    }
  </script>
</body>
</html>
