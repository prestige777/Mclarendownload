<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mclarendownload</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #000 0%, #1a1a1a 100%);
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 3em;
      color: #e60000;
      text-shadow: 0 0 20px rgba(230, 0, 0, 0.5);
      margin-bottom: 10px;
    }

    .subtitle {
      color: #aaa;
      font-size: 1.1em;
    }

    .input-section {
      background: #111;
      padding: 30px;
      border-radius: 12px;
      border: 2px solid #e60000;
      margin-bottom: 30px;
      box-shadow: 0 0 30px rgba(230, 0, 0, 0.2);
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 15px;
      border: 2px solid #333;
      border-radius: 8px;
      background: #000;
      color: #fff;
      font-size: 1em;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #e60000;
    }

    .btn {
      padding: 15px 30px;
      border: none;
      border-radius: 8px;
      background: #e60000;
      color: #fff;
      font-size: 1em;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn:hover {
      background: #b30000;
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(230, 0, 0, 0.4);
    }

    .btn:disabled {
      background: #666;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: #333;
    }

    .btn-secondary:hover {
      background: #555;
    }

    .video-section {
      background: #111;
      padding: 30px;
      border-radius: 12px;
      border: 2px solid #e60000;
      margin-bottom: 30px;
      display: none;
      box-shadow: 0 0 30px rgba(230, 0, 0, 0.2);
    }

    .video-section.active {
      display: block;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .download-controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .status {
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
      font-weight: bold;
    }

    .status.show {
      display: block;
    }

    .status.success {
      background: #1a5f1a;
      color: #90EE90;
      border: 1px solid #90EE90;
    }

    .status.error {
      background: #5f1a1a;
      color: #FF6B6B;
      border: 1px solid #FF6B6B;
    }

    .status.loading {
      background: #1a3a5f;
      color: #87CEEB;
      border: 1px solid #87CEEB;
    }

    .video-info {
      color: #aaa;
      font-size: 0.9em;
      margin-top: 15px;
    }

    footer {
      text-align: center;
      color: #666;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎬 Mclarendownload</h1>
      <p class="subtitle">Download YouTube & Facebook Videos</p>
    </header>

    <div class="input-section">
      <p style="margin-bottom: 15px; color: #ccc;">Paste a YouTube or Facebook video URL:</p>
      <div class="input-group">
        <input 
          type="text" 
          id="videoUrl" 
          placeholder="https://www.youtube.com/watch?v=... or https://www.facebook.com/..."
        >
        <button class="btn" onclick="searchVideo()">Search</button>
      </div>
      <div id="statusSearch" class="status"></div>
    </div>

    <div id="videoSection" class="video-section">
      <div id="statusDownload" class="status"></div>
      <div id="videoContainer"></div>
      <div class="download-controls">
        <button class="btn" id="downloadBtn" onclick="downloadVideo()">⬇️ Download Video</button>
        <button class="btn btn-secondary" id="openBtn" onclick="openInNewTab()">🔗 Open in New Tab</button>
      </div>
      <div class="video-info" id="videoInfo"></div>
    </div>

    <footer>
      <p>&copy; 2026 Mclarendownload. All rights reserved.</p>
    </footer>
  </div>

  <script>
    let currentUrl = '';

    function getYouTubeId(url) {
      const regex = /(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
      const match = url.match(regex);
      return match ? match[1] : null;
    }

    function showStatus(elementId, message, type) {
      const el = document.getElementById(elementId);
      el.textContent = message;
      el.className = `status show ${type}`;
    }

    function clearStatus(elementId) {
      const el = document.getElementById(elementId);
      el.className = 'status';
    }

    function searchVideo() {
      const url = document.getElementById('videoUrl').value.trim();
      const videoSection = document.getElementById('videoSection');
      const container = document.getElementById('videoContainer');

      if (!url) {
        showStatus('statusSearch', '❌ Please enter a URL', 'error');
        videoSection.classList.remove('active');
        return;
      }

      clearStatus('statusSearch');

      if (url.includes('youtube.com') || url.includes('youtu.be')) {
        const videoId = getYouTubeId(url);
        if (videoId) {
          currentUrl = url;
          container.innerHTML = `<div class="video-wrapper"><iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe></div>`;
          videoSection.classList.add('active');
          document.getElementById('videoInfo').textContent = '✅ Video loaded! Ready to download.';
        } else {
          showStatus('statusSearch', '❌ Invalid YouTube URL', 'error');
          videoSection.classList.remove('active');
        }
      } else if (url.includes('facebook.com')) {
        currentUrl = url;
        container.innerHTML = `<div class="video-wrapper"><iframe src="https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(url)}&show_text=0&width=500" allowfullscreen></iframe></div>`;
        videoSection.classList.add('active');
        document.getElementById('videoInfo').textContent = '✅ Facebook video loaded! Ready to download.';
      } else {
        showStatus('statusSearch', '❌ Unsupported URL. Use YouTube or Facebook links.', 'error');
        videoSection.classList.remove('active');
      }
    }

    function downloadVideo() {
      if (!currentUrl) {
        showStatus('statusDownload', '❌ Please search for a video first', 'error');
        return;
      }

      const btn = document.getElementById('downloadBtn');
      btn.disabled = true;
      btn.textContent = '⏳ Processing...';

      showStatus('statusDownload', '⏳ Fetching download link...', 'loading');

      const endpoint = currentUrl.includes('facebook') ? '/api/download-facebook' : '/api/download-youtube';

      fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: currentUrl })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.videoUrl) {
          const a = document.createElement('a');
          a.href = data.videoUrl;
          a.download = (data.title || 'video') + '.mp4';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          
          showStatus('statusDownload', '✅ Download started! Check your Downloads folder.', 'success');
          document.getElementById('videoInfo').textContent = `Title: ${data.title} | Quality: ${data.quality}`;
        } else {
          showStatus('statusDownload', `❌ ${data.error || 'Could not extract video'}`, 'error');
        }
      })
      .catch(err => {
        showStatus('statusDownload', `❌ Error: ${err.message}`, 'error');
      })
      .finally(() => {
        btn.disabled = false;
        btn.textContent = '⬇️ Download Video';
      });
    }

    function openInNewTab() {
      if (!currentUrl) {
        showStatus('statusDownload', '❌ Please search for a video first', 'error');
        return;
      }

      const endpoint = currentUrl.includes('facebook') ? '/api/download-facebook' : '/api/download-youtube';

      fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: currentUrl })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.videoUrl) {
          window.open(data.videoUrl, '_blank');
          showStatus('statusDownload', '✅ Video opened in new tab', 'success');
        } else {
          showStatus('statusDownload', `❌ ${data.error || 'Could not extract video'}`, 'error');
        }
      })
      .catch(err => {
        showStatus('statusDownload', `❌ Error: ${err.message}`, 'error');
      });
    }
  </script>
</body>
</html>
